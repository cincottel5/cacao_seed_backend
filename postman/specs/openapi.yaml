      operationId: deleteBookScheduling
      tags:
        - Book Scheduling
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Scheduling removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /budgets/{budgetId}/transactions:
    parameters:
      - $ref: '#/components/parameters/budgetId'

    get:
      summary: List transactions
      operationId: listTransactions
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: bookId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: periodId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
                    required:
                      - items
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create transaction
      operationId: createTransaction
      tags:
        - Transactions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                currency:
                  type: string
                  enum:
                    - crc
                    - usd
                type:
                  type: string
                date:
                  type: string
                  format: date
                takeInBookId:
                  type: string
                  format: uuid
                takeFromBookId:
                  type: string
                  format: uuid
                comments:
                  type: string
                referenceNumber:
                  type: string
                authorizationNumber:
                  type: string
                merchant:
                  type: string
              required:
                - amount
                - currency
                - type
              description: At least one of takeInBookId or takeFromBookId is required.
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /budgets/{budgetId}/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/budgetId'
      - $ref: '#/components/parameters/transactionId'

    get:
      summary: Get transaction
      operationId: getTransaction
      tags:
        - Transactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update transaction
      operationId: updateTransaction
      tags:
        - Transactions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                currency:
                  type: string
                  enum:
                    - crc
                    - usd
                date:
                  type: string
                  format: date
                comments:
                  type: string
                referenceNumber:
                  type: string
                authorizationNumber:
                  type: string
                merchant:
                  type: string
              description: >
